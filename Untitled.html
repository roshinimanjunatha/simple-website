<!DOCTYPE html>
<html>
<head>
  <title>Cafe Menu</title>

  <style>
    body{
      font-family: Arial;
      background-color: #f5f5f5;
      padding: 30px;
    }

     <style>
  
    .card img{
      width: 100%;
      height: 180px;
      border-radius: 10px;
      object-fit: cover;
    }

    h2{
      margin: 10px 0;
    }

    .price{
      color: green;
      font-size: 22px;
      font-weight: bold;
    }

    .quantity-box{
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    button{
      width: 35px;
      height: 35px;
      border: none;
      background-color: brown;
      color: white;
      font-size: 20px;
      border-radius: 50%;
      cursor: pointer;
    }

    #count{
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
    
    <!-- Image -->
    <img src="coffee.jpg" alt="Coffee">

    <!-- Name -->
    <h2>Cappuccino</h2>

    <!-- Price -->
    <div class="price">₹120</div>

    <!-- Quantity buttons -->
    <div class="quantity-box">
        <button onclick="decrease()">-</button>
        <span id="count">0</span>
        <button onclick="increase()">+</button>
    </div>

</div>

<script>
let count = 0;

function increase(){
   count++;
   document.getElementById("count").innerText = count;
}

function decrease(){
   if(count > 0){
      count--;
      document.getElementById("count").innerText = count;
   }
}
</script>

</body>
</html>
